<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qshot · 子弹搜索（网页版）</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <!-- 卡片区 -->
  <main class="cards-panel" id="cardsPanel">
    <div id="iframesContainer" class="iframes-container"></div>
    <div id="emptyState" class="empty-state">
      <img src="assets/icon.png" alt="" width="72" height="72">
      <h2>一次提问，多站对比</h2>
      <p>在下方输入问题，选择站点，一键分发到多个 AI / 搜索站点。</p>
      <p class="empty-hint">按 <kbd>Enter</kbd> 发送 · <kbd>Ctrl</kbd> + <kbd>Enter</kbd> 换行 · 按 <kbd>/</kbd> 聚焦输入框</p>
    </div>
  </main>

  <!-- 历史侧栏 -->
  <aside id="historyPanel" class="history-panel hidden">
    <div class="panel-head">
      <h3>历史记录</h3>
      <button class="panel-close" data-close="historyPanel">×</button>
    </div>
    <div class="history-filter">
      <button class="hf-btn active" data-filter="all">全部</button>
      <button class="hf-btn" data-filter="today">今天</button>
      <button class="hf-btn" data-filter="yesterday">昨天</button>
      <button id="btnClearHistory" class="hf-btn danger">清空</button>
    </div>
    <div id="historyList" class="history-list"></div>
  </aside>

  <!-- 底部输入区 -->
  <footer class="bottom-composer">
    <div class="composer-inner">
      <div class="composer-toolbar">
        <button id="btnPrompts" class="tool-btn" title="提示词库">✨</button>
        <button id="btnHistory" class="tool-btn" title="历史记录">🕘</button>
        <button id="btnExport" class="tool-btn" title="导出本次会话为 Markdown">⬇</button>
        <button id="btnSitePicker" class="tool-btn" title="选择站点">🌐</button>
        <div class="width-picker">
          <button id="btnCardWidth" class="tool-btn" title="卡片宽度">↔</button>
          <div id="widthMenu" class="width-menu hidden">
            <button data-width="1">320 px</button>
            <button data-width="2">440 px</button>
            <button data-width="3">580 px</button>
            <button data-width="4">720 px</button>
            <button data-width="5">960 px</button>
          </div>
        </div>
        <button id="btnDarkMode" class="tool-btn" title="切换明暗模式">🌙</button>
        <button id="btnClearCards" class="tool-btn" title="清空所有卡片">🗑</button>
        <span class="tool-sep"></span>
        <div id="selectedSitesChips" class="selected-sites-chips"></div>
      </div>
      <div class="composer-row">
        <div class="input-wrap" id="inputWrap">
          <button id="btnExpand" class="expand-btn" title="放大输入框">⤢</button>
          <textarea id="queryInput" placeholder="输入你的问题，一次发送到多个站点…"></textarea>
          <div class="input-actions">
            <button id="btnSend" class="send-btn icon-only" title="发送 (Enter)">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </footer>
</div>

<!-- 站点选择弹层 -->
<div id="sitePickerModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3>选择站点</h3>
      <button class="panel-close" data-close="sitePickerModal">×</button>
    </div>
    <div class="modal-body">
      <div class="sp-actions">
        <button class="hf-btn" id="spSelectAi">全选 AI</button>
        <button class="hf-btn" id="spSelectOther">全选社媒</button>
        <button class="hf-btn" id="spSelectAll">全选</button>
        <button class="hf-btn" id="spSelectNone">全不选</button>
      </div>
      <h4 class="sp-cat">AI 对话</h4>
      <div id="spAiList" class="sp-grid"></div>
      <h4 class="sp-cat">社媒 / 搜索</h4>
      <div id="spOtherList" class="sp-grid"></div>
      <h4 class="sp-cat">自定义站点</h4>
      <div id="spCustomList" class="sp-grid"></div>
      <div class="add-site-form">
        <h4 class="sp-cat">添加自定义站点</h4>
        <div class="add-site-row">
          <input id="customSiteName" type="text" placeholder="名称，如：我的博客搜索">
          <input id="customSiteUrl" type="text" placeholder="URL，可用 {query} 占位问题，如 https://example.com/s?q={query}">
          <button id="btnAddCustomSite" class="hf-btn">添加</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 提示词弹层 -->
<div id="promptsModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3>提示词库</h3>
      <button class="panel-close" data-close="promptsModal">×</button>
    </div>
    <div class="modal-body" id="promptsList"></div>
    <div class="modal-foot">
      <input id="newPromptTitle" type="text" placeholder="标题">
      <input id="newPromptContent" type="text" placeholder="内容">
      <button id="btnAddPrompt" class="hf-btn">添加到第一个分组</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/sites-data.js"></script>
<script src="js/default-state.js"></script>
<script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light">
<title>浏览器内核检测</title>
<style>
:root{
  --tb--main:#7CB342;
  --tb--base:#333;
  --tb--dark:#202935;
  --tb--white:#fff;
  --tb--bdbg:#f4f4f4;
  --tb--tint:#fbfbfb;
  --tb--line:#f3f3f3;
  --tb--gray:#999;
  --tb--label:#666;
}

*{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  font-size:14px;
  line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Microsoft Yahei",MiSans,"HarmonyOS Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
  color:var(--tb--base);
  background-color:var(--tb--bdbg);
  overflow-x:hidden;
  padding:40px 0;
}
h1,h2,h3,h4,h5,h6{ margin:0; font-weight:700; }
p{ margin:0; }

.container{
  position:relative;
  margin:0 auto;
  padding:0 20px;
  max-width:1313px;
}

.pagecontent{
  padding:30px;
  background-color:var(--tb--white);
  border-radius:6px;
  margin-bottom:20px;
}

.article-header{
  margin-bottom:30px;
  text-align:center;
}
.article-title{
  font-size:25px;
  font-weight:700;
  color:var(--tb--base);
}

.article-content{
  font-size:16px;
  line-height:1.8;
  word-wrap:break-word;
  color:var(--tb--base);
}
.article-content:after{ display:block; clear:both; content:""; }
.article-content p{ margin:20px 0; word-wrap:break-word; }

/* 检测结果：键值逐行输出，长串自动折行 */
.core-output .key{ color:var(--tb--label); }
.core-output .sep{ color:var(--tb--gray); padding:0 2px; }
.core-output .val{ color:var(--tb--base); word-break:break-all; }

.article-content .note{ color:var(--tb--gray); font-size:14px; }

::selection{ background:rgba(124,179,66,.22); }

@media(max-width:600px){
  body{ padding:0; }
  .container{ padding:0; }
  .pagecontent{ padding:15px; border-radius:0; margin-bottom:0; }
  .article-header{ text-align:left; padding:12px 0 15px; margin-bottom:0; }
  .article-title{ font-size:20px; }
  .article-content{ font-size:16px; line-height:1.7; }
}
</style>
</head>
<body>

<section class="container">
  <div class="pagecontent">
    <header class="article-header">
      <h1 class="article-title">浏览器内核检测</h1>
    </header>

    <article class="article-content">
      <p>***********当前浏览器全部原始信息如下************</p>
      <p class="core-output" id="core-output"></p>
      <p class="note">本页面源代码来自网络，仅供参考。</p>
    </article>
  </div>
</section>

<script type="text/javascript">
(function () {
  var n = navigator;
  var ua = n.userAgent || "";

  /* ---------- 浏览器名称 / 版本 / 内核 ---------- */
  function detectBrowser(u) {
    var m;
    if ((m = u.match(/Edg(?:e|A|iOS)?\/([\d.]+)/)))  return { name: "Edge",    version: m[1], engine: "Blink",  vendor: "Microsoft" };
    if ((m = u.match(/OPR\/([\d.]+)/)))               return { name: "Opera",   version: m[1], engine: "Blink",  vendor: "Opera Software" };
    if ((m = u.match(/Vivaldi\/([\d.]+)/)))           return { name: "Vivaldi", version: m[1], engine: "Blink",  vendor: "Vivaldi Technologies" };
    if ((m = u.match(/Firefox\/([\d.]+)/)))           return { name: "Firefox", version: m[1], engine: "Gecko",  vendor: "Mozilla" };
    if ((m = u.match(/Chrome\/([\d.]+)/)))            return { name: "Chrome",  version: m[1], engine: "Blink",  vendor: "Google" };
    if ((m = u.match(/Version\/([\d.]+).*Safari/)))   return { name: "Safari",  version: m[1], engine: "WebKit", vendor: "Apple" };
    if (/Trident\/|MSIE/.test(u))                     return { name: "IE",      version: "兼容模式", engine: "Trident", vendor: "Microsoft" };
    return { name: "未知", version: "未知", engine: "未知", vendor: "未知" };
  }
  var b = detectBrowser(ua);

  /* ---------- CPU 架构 / 位数 ---------- */
  function detectArch(u) {
    if (/arm64|aarch64/i.test(u))            return "ARM64（64 位）";
    if (/WOW64|Win64|x64|amd64|x86_64/i.test(u)) return "x64（64 位）";
    if (/arm/i.test(u))                      return "ARM（32 位）";
    if (/Win32/i.test(u))                    return "x86（32 位）";
    return n.platform || "未知";
  }

  /* ---------- 语言 / 时区 ---------- */
  var langs = (n.languages && n.languages.length) ? n.languages.join(", ") : (n.language || "未知");
  var zone = "未知";
  try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone || "未知"; } catch (e) {}

  /* ---------- 结果行 ---------- */
  var rows = [
    ["浏览器厂商",        b.vendor],
    ["浏览器名称",        b.name],
    ["浏览器版本",        b.version],
    ["浏览器内核",        b.engine],
    ["平台和版本信息",    n.appVersion || "未知"],
    ["是否启用 Cookie",   n.cookieEnabled ? "是" : "否"],
    ["CPU 架构",          detectArch(ua)],
    ["是否处于脱机模式",  n.onLine ? "否（当前在线）" : "是（当前离线）"],
    ["操作系统平台",      n.platform || "未知"],
    ["User-Agent 头部",   ua],
    ["浏览器的语言",      langs],
    ["系统时区",          zone]
  ];

  var frag = document.createDocumentFragment();
  rows.forEach(function (r) {
    var line = document.createElement("div");
    line.className = "row";

    var k = document.createElement("span");
    k.className = "key";
    k.textContent = r[0];

    var s = document.createElement("span");
    s.className = "sep";
    s.textContent = "=";

    var v = document.createElement("span");
    v.className = "val";
    v.textContent = r[1];

    line.appendChild(k);
    line.appendChild(s);
    line.appendChild(v);
    frag.appendChild(line);
  });

  document.getElementById("core-output").appendChild(frag);
})();
</script>

</body>
</html>
